name: Auto-Update Batcave Telemetry Stats

on:
  schedule:
    # Run automatically every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/batcave-problem-solving.svg"
      - "assets/batcave-developer-level.svg"
      - "README.md"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Telemetry Update Script
        run: |
          python scripts/update_stats.py

      - name: Commit and Push Updated Stats
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/batcave-problem-solving.svg assets/batcave-developer-level.svg README.md
          if git diff --staged --quiet; then
            echo "No telemetry changes detected."
          else
            git commit -m "chore(telemetry): auto-update live batcave stats [skip ci]"
            git push origin main
          fi
